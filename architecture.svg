<text x="700.0" y="955" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a2540" text-anchor="middle">Flow:  Resume + Role  →  Skill Extraction  →  Query Construction  →  Retrieval  →  Question Generation  →  Answer Storage  →  Summary</text>
<text x="700.0" y="975" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="italic" fill="#5b6472" text-anchor="middle">Every question is stored with a traceable link back to its source knowledge-base chunk and the resume skill that triggered it.</text>
